
<section class="w-full flex justify-center flex-col items-center mt-8">
    <div class="relative w-10 h-10 overflow-hidden bg-gray-100 rounded-full dark:bg-gray-600">
        <svg class="absolute w-12 h-12 text-gray-400 -left-1" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
    </div>
    <div class="w-full max-w-sm p-4 bg-white border border-gray-200 rounded-lg shadow-sm sm:p-6 md:p-8 dark:bg-gray-800 dark:border-gray-700">
        <form  class="max-w-sm mx-auto" [formGroup]="applyForm" (submit)="submitRegister()">
            <div class="mb-5">
                <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">用户名</label>
                <input id="name" type="text" formControlName="name" class="block w-full p-4 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 text-base focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"/>
            </div>
    
            <div class="mb-5">
                <label for="password" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">密码</label>
                <input id="password" type="text" formControlName="password" class="block w-full p-4 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 text-base focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"/>
            </div>
            <div *ngIf="(applyForm.get('password')?.invalid && applyForm.get('password')?.touched) || (isSubmitted() && applyForm.get('password')?.invalid)">
                <span *ngIf="applyForm.get('password')?.errors?.['minlength']">密码长度不能少于6位</span>
                <span *ngIf="applyForm.get('password')?.errors?.['pattern']">密码只能包含字母和数字</span>
              </div>
            
            @if(!hasNoEmail()) {
                <div class="mb-5">
                    <div class="flex items-center justify-start mb-2">
                        <label for="email" class="block text-sm font-medium text-gray-900 dark:text-white mr-2">Email</label>
                        <span class="ml-3 text-rting-blue-50 font-normal text-sm text-blue-300 cursor-pointer" (click)="hasNoEmail.set(true)">没有email？</span>
                    </div>
                    <input id="email" type="text" formControlName="email" class="block w-full p-4 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 text-base focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"/>
                </div>
            }
           
            @if(hasNoEmail()) {
                <div class="mb-5">
                    <div class="flex items-center justify-start mb-2">
                        <label for="phone" class="block text-sm font-medium text-gray-900 dark:text-white">电话号码</label>
                        <span class="ml-3 text-rting-blue-50 font-normal text-sm text-blue-300 cursor-pointer" (click)="hasNoEmail.set(false)">填写Email</span>
                    </div>
                    <input id="phone" type="text" formControlName="email" class="block w-full p-4 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 text-base focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"/>
                </div>
            }  
            <button type="submit" class="text-white w-full bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">立即注册</button>
            <div class="text-sm font-medium text-gray-500 dark:text-gray-300 flex justify-center mt-4">
                <a  class="text-blue-700 hover:underline cursor-pointer dark:text-blue-500" routerLink="/login">返回登陆</a>
            </div>
        </form>
    </div>
  
  </section>
